[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-pages-platform"
version = "1.0.0"
description = "Enterprise LinkedIn Company Pages ingestion framework (official API) — posts to standardized DataFrames, CSV by default, optional Google Sheets."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "gspread>=6.0",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
